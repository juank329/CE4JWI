<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Roboto:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Roboto:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Roboto:wght@500;700;900&display=swap"></noscript>

  <title>Log en tiempo real — CE4JWI</title>
  <meta name="description" content="Logbook en tiempo real de CE4JWI. Cada QSL aparece automaticamente al confirmarse el QSO.">

  <link rel="stylesheet" href="recursos/styles.css">
  <link rel="stylesheet" href="recursos/header-responsive.css">
  <link rel="stylesheet" href="recursos/slider.css">
  <link rel="stylesheet" href="recursos/log.css">

  <link rel="icon" href="public/favicon-32x32.png">
</head>
<body>
  <div id="header-container"></div>
  <div id="marquee-container"></div>

  <main class="main-container">
    <div class="content">

      <div class="banner">
        <h1>Log en tiempo real</h1>
      </div>

      <section class="page-content">

        <div class="qsl-search-bar">
          <input type="text" id="qslInput" placeholder="Escribe un callsign..." autofocus>
          <button id="qslBtnBuscar" class="qsl-btn blue" onclick="qslBuscar()">Buscar</button>
          <button id="qslBtnTodas" class="qsl-btn red" onclick="qslCargarTodas()">Ver todas</button>
        </div>

        <div class="qsl-status" id="qslStatus">
          <div class="qsl-spinner"></div>
          <span>Cargando QSLs...</span>
        </div>

        <div class="qsl-grid" id="qslGrid"></div>

        <div class="nota">
          <span class="etiqueta">DATO ÚTIL</span>
          <p>Cada QSO confirmado se registra automaticamente con imagen QSL, banda, modo y comentarios. Usa el buscador para encontrar contactos por callsign, o revisa las ultimas QSLs en tiempo real.</p>
        </div>
      </section>

    </div>
  </main>

  <div id="footer-container"></div>

  <script src="recursos/actividades.js" defer></script>
  <script defer src="recursos/componentes.js"></script>

  <div class="qsl-lightbox" id="qslLightbox" onclick="qslCloseLightbox()">
    <button class="qsl-lb-close" onclick="qslCloseLightbox()">&times;</button>
    <img id="qslLbImg" src="">
    <div class="qsl-lb-info">
      <div class="qsl-lb-call" id="qslLbCall"></div>
      <div class="qsl-lb-detail" id="qslLbDetail"></div>
    </div>
  </div>

  <script>
  (function(){
    var SURL = "https://fuxvowudtaqeyqbnuhss.supabase.co";
    var SKEY = "sb_publishable_Ske2CJsnJH9PiU3gu5M9jw_dzdRVqfN";
    var HDR = {"apikey":SKEY,"Authorization":"Bearer "+SKEY,"Content-Type":"application/json"};
    var timer = null;

    window.qslCargarTodas = function(){
      setStatus('<div class="qsl-spinner"></div><span>Cargando QSLs...</span>');
      fetch(SURL+"/rest/v1/qsls?select=*&order=fecha_creacion.desc&limit=500",{headers:HDR})
        .then(function(r){return r.json()})
        .then(function(d){qslMostrar(d)})
        .catch(function(e){setStatus("Error: "+e.message)});
    };

    window.qslBuscar = function(){
      var q = document.getElementById("qslInput").value.trim().toUpperCase();
      if(!q){qslCargarTodas();return}
      setStatus("Buscando "+q+"...");
      fetch(SURL+"/rest/v1/qsls?select=*&callsign=ilike.*"+encodeURIComponent(q)+"*&order=fecha_creacion.desc&limit=100",{headers:HDR})
        .then(function(r){return r.json()})
        .then(function(d){qslMostrar(d)})
        .catch(function(e){setStatus("Error: "+e.message)});
    };

    function setStatus(html){document.getElementById("qslStatus").innerHTML=html}

    function qslMostrar(data){
      var g = document.getElementById("qslGrid");
      g.innerHTML = "";
      if(!data||data.length===0){setStatus("No se encontraron QSLs");return}
      setStatus('<span class="qsl-count">'+data.length+'</span> QSLs encontradas');
      data.forEach(function(q){
        var card = document.createElement("div");
        card.className = "qsl-card";
        card.onclick = function(){qslOpenLightbox(q)};
        card.innerHTML =
          "<img src='"+q.url_imagen+"' loading='lazy' onerror=\"this.parentElement.style.display='none'\">" +
          "<div class='qsl-card-body'>" +
            "<div class='qsl-card-call'>"+(q.callsign||"?")+"</div>" +
            "<div class='qsl-card-tags'>" +
              "<span class='qsl-tag band'>"+(q.banda||"--")+"</span>" +
              "<span class='qsl-tag mode'>"+(q.modo||"--")+"</span>" +
              "<span class='qsl-tag date'>"+(q.fecha||"")+" "+(q.hora||"")+" UTC</span>" +
            "</div>" +
            (q.comentario ? "<div class='qsl-card-comment'>"+q.comentario+"</div>" : "") +
          "</div>";
        g.appendChild(card);
      });
    }

    window.qslOpenLightbox = function(q){
      document.getElementById("qslLbImg").src = q.url_imagen;
      document.getElementById("qslLbCall").textContent = q.callsign||"";
      document.getElementById("qslLbDetail").textContent = (q.fecha||"")+" "+(q.hora||"")+" UTC | "+(q.banda||"")+" | "+(q.modo||"");
      document.getElementById("qslLightbox").classList.add("active");
    };

    window.qslCloseLightbox = function(){
      document.getElementById("qslLightbox").classList.remove("active");
    };

    document.addEventListener("keydown",function(e){
      if(e.key==="Escape") qslCloseLightbox();
      if(e.key==="Enter"&&document.activeElement===document.getElementById("qslInput")) qslBuscar();
    });

    function startAutoRefresh(){
      timer = setInterval(function(){
        var q = document.getElementById("qslInput").value.trim().toUpperCase();
        if(q) qslBuscar(); else qslCargarTodas();
      },15000);
    }

    var p = new URLSearchParams(window.location.search);
    var initCall = p.get("callsign");
    if(initCall){document.getElementById("qslInput").value=initCall.toUpperCase();qslBuscar()}
    else{qslCargarTodas()}
    startAutoRefresh();
  })();
  </script>
</body>
</html>
