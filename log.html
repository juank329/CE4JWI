<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>

  <title>Log en tiempo real — CE4JWI</title>
  <meta name="description" content="Logbook en tiempo real de CE4JWI sincronizado con HRDLog.net. Cada QSO confirmado en tu log aparece automáticamente.">

  <link rel="stylesheet" href="recursos/styles.css">
  <link rel="stylesheet" href="recursos/header-responsive.css">
  <link rel="stylesheet" href="recursos/slider.css">
  <link rel="stylesheet" href="recursos/log.css">

  <link rel="icon" href="public/favicon-32x32.png">
</head>
<body>
  <div id="header-container"></div>
  <div id="marquee-container"></div>

  <main class="main-container">
    <div class="content">

      <div class="banner">
        <h1>Log en tiempo real</h1>
      </div>

      <section class="page-content">
        <div id="logApp" class="log-app-modern">
          <!-- HRDLOG.net iframe - Datos en tiempo real -->
          <div class="hrdlog-container">
            <div class="hrdlog-header">
              <div class="hrdlog-title">
                <span class="hrdlog-icon">📡</span>
                <h2>Mis QSOs en tiempo real</h2>
              </div>
              <div class="hrdlog-status">
                <span id="statusIndicator" class="status-badge status-online">
                  <span class="status-dot"></span>
                  <span class="status-text">Online</span>
                </span>
                <span class="status-time">Última actualización: <span id="lastUpdateTime">ahora</span></span>
              </div>
            </div>
            <iframe 
              src="https://www.hrdlog.net/hrdlogframe.aspx?user=CE4JWI&lastqso=20&qsomap=&options=search;viewbandslots;showcomment;viewdxcc;disablelinks;" 
              width="100%" 
              height="700" 
              scrolling="auto"
              class="hrdlog-iframe"
              frameborder="0"
            ></iframe>
          </div>
        </div>
      </section>

    </div>
      
    <div id="sidebar-container"></div>
  </main>

  <div id="footer-container"></div>

  <script defer src="recursos/componentes.js"></script>
  <script defer src="recursos/log.js"></script>
</body>
</html>
