<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">

  <title>Código Fonético y Morse - CE4JWI</title>
  <meta name="description" content="Traductor y tabla de referencia del alfabeto fonético ITU/OACI y código Morse internacional">
  <link rel="stylesheet" href="recursos/styles.css">
  <link rel="stylesheet" href="recursos/header-responsive.css">
  <link rel="stylesheet" href="recursos/slider.css">

<body>
  <div id="header-container"></div>
  <div id="marquee-container"></div>

  <main class="main-container">
    <div class="content">

      <div class="banner">
        <h1>Código Fonético y Morse</h1>
      </div>

      <section class="page-content">
        <form class="tool-form" onsubmit="return false;">
          <input type="text" id="foneticoInput" placeholder="Escribe aquí (ej: CE4JWI)" autocomplete="off" oninput="traducirTexto()">

        <div class="fonetico-resultado">
          <h4>Alfabeto Fonético</h4>
          <p id="salidaFonetico">—</p>
          <h4>Código Morse</h4>
          <p id="salidaMorse">—</p>
        </div>

        <h3 class="titulo" style="margin-bottom:1rem;">Tabla de referencia completa</h3>
        <div class="fonetico-tabla" id="tablaFoneticoMorse"></div>
      </section>

    </div>

    <div id="sidebar-container"></div>
  </main>

  <div id="footer-container"></div>

  <script defer src="recursos/componentes.js"></script>
  <script defer src="recursos/herramientas.js"></script>
