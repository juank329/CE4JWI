<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking en Vivo CONDORITO 2026 - CA4NDW-7 y CE4JWI-10</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; padding: 16px; color: #111827; }
    .rk-box { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); overflow: hidden; }
    .rk-head { background: linear-gradient(135deg, #0b4f84, #1f7aa3); color: #fff; padding: 14px 18px; }
    .rk-head h1 { font-size: 1.05rem; line-height: 1.3; font-weight: 700; }
    .rk-head .sub { font-size: 0.78rem; opacity: 0.9; margin-top: 3px; }
    .rk-live { display: inline-block; background: #0e8a5f; color: #fff; font-weight: 700; font-size: 0.7rem; padding: 2px 10px; border-radius: 50px; letter-spacing: 0.4px; margin-right: 6px; text-transform: uppercase; vertical-align: middle; }
    .rk-live::before { content: ""; display: inline-block; width: 7px; height: 7px; background: #fff; border-radius: 50%; margin-right: 5px; vertical-align: middle; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .rk-live.finalizado { background: #6c757d; }
    .rk-live.finalizado::before { animation: none; opacity: 1; }
    .rk-meta { padding: 10px 18px 0; font-size: 0.78rem; color: #667085; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .rk-total { font-weight: 700; color: #0b4f84; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: #0b4f84; color: #fff; padding: 10px 12px; text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
    thead th:first-child { text-align: center; width: 40px; }
    tbody tr:nth-child(odd) { background: #fff; }
    tbody tr:nth-child(even) { background: #F0F7FC; }
    tbody td { padding: 9px 12px; font-size: 0.88rem; border-top: 1px solid #E5E7EB; }
    tbody td:first-child { text-align: center; font-weight: 800; color: #0b4f84; }
    .call-badge { display: inline-block; background: #0b4f84; color: #fff !important; padding: 2px 10px; border-radius: 6px; font-weight: 700; font-family: 'Courier New', monospace; font-size: 0.82rem; text-decoration: none; }
    .chip { display: inline-block; padding: 2px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; color: #fff; margin: 2px 3px 2px 0; white-space: nowrap; }
    .chip-ref01 { background: #7d3c98; }
    .chip-ref02 { background: #0b4f84; }
    .chip-ref03 { background: #d70d0d; }
    .chip-ref04 { background: #182748; }
    .chip-ref05 { background: #0e8a5f; }
    .chip-ref06 { background: #b45309; }
    .chip-ref07 { background: #f7c948; color: #111; }
    .chip-ref08 { background: #ff2d95; }
    .chip-ref09 { background: #ff8a00; }
    .chip-ref10 { background: #22d3ee; }
    .chip-ref11 { background: #a3e635; }
    .chip-ref12 { background: #14b8a6; }
    .chip-ref13 { background: #ff6bd6; }
    .chip-ref14 { background: #ff6f61; }
    .chip-trofeo { background: #b8860b; font-size: 1.1rem; }
    .chip-none { background: #dfe6ee; color: #6c757d; }
    .rk-empty { text-align: center; padding: 40px 16px; color: #6c757d; font-size: 0.9rem; }
    .rk-empty .spin { display: inline-block; width: 26px; height: 26px; border: 3px solid #e0e0e0; border-top-color: #0b4f84; border-radius: 50%; animation: rot 0.8s linear infinite; margin-bottom: 10px; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .rk-foot { text-align: center; padding: 10px; font-size: 0.72rem; color: #98a2b3; }
  </style>
</head>
<body>
  <div class="rk-box">
    <div class="rk-head">
      <h1><span class="rk-live">En vivo</span>Los Personajes de la Historieta Chilena CONDORITO 2026</h1>
      <div class="sub">CA4NDW-7 y CE4JWI-10 &middot; Solo APRS</div>
    </div>
    <div class="rk-meta">
      <span class="rk-total" id="rk-total">Cargando&hellip;</span>
      <span id="rk-updated"></span>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th>#</th><th>Indicativo</th><th>QSO</th><th>Personajes</th></tr>
        </thead>
        <tbody id="rk-tbody">
          <tr><td colspan="4"><div class="rk-empty"><div class="spin"></div><div>Cargando ranking&hellip;</div></div></td></tr>
        </tbody>
      </table>
    </div>
    <div class="rk-foot">Ranking en tiempo real &middot; actualiza cada 60 s &middot; Visita qsl.net/ce4jwi</div>
  </div>

  <script src="recursos/banderas_20260916.js" defer></script>
  <script>
    (function () {
      var tbody = document.getElementById("rk-tbody");
      var estTotal = document.getElementById("rk-total");
      if (!tbody) return;

      function pintar(d) {
        if (!d.ok || !Array.isArray(d.filas)) throw new Error("formato invalido");
        var live = document.querySelector(".rk-live");
        if (live) {
          var fin = d.congelado === true;
          live.textContent = fin ? "Finalizado" : "En vivo";
          live.className = "rk-live" + (fin ? " finalizado" : "");
        }
        if (estTotal) estTotal.textContent = d.totalContactos + " QSO \u00b7 " + d.participantes + " estaciones";
        var upd = document.getElementById("rk-updated");
        if (upd && d.actualizado) {
          var t = new Date(d.actualizado);
          upd.textContent = "Actualizado el " + t.toLocaleDateString("es-CL") + " a las " + t.toLocaleTimeString("es-CL");
        }
        if (!d.filas.length) {
          tbody.innerHTML = '<tr><td colspan="4"><div class="rk-empty">A\u00fan no hay contactos registrados.</div></td></tr>';
          return;
        }
        tbody.innerHTML = d.filas.map(function (f, i) {
          var chips = (f.personajes && f.personajes.length)
            ? f.personajes.map(function (p) {
                var cls = /^\d{2}$/.test(p.ref || "") ? "chip chip-ref" + p.ref : "chip chip-none";
                var nom = (p.nombre || "").toLowerCase();
                nom = nom.charAt(0).toUpperCase() + nom.slice(1);
                if (p.ref === "06") { nom = "Con\u00e9"; }
                return '<span class="' + cls + '">' + nom + '</span>';
              }).join(" ")
            : '<span class="chip chip-none">-</span>';
          var totalCell = (f.personajes && f.personajes.length >= 14)
            ? '<span class="chip chip-trofeo" title="Colecci\u00f3n completa 14/14">\uD83C\uDFC6</span>'
            : (f.total || 0);
          return '<tr><td>' + (i + 1) + '</td><td><a class="call-badge" href="https://www.qrz.com/db/' + f.call + '" target="_blank" rel="noopener">' + f.call + '</a></td><td>' + totalCell + '</td><td>' + chips + '</td></tr>';
        }).join("");
      }

      function cargar() {
        return fetch("ranking_condorito_conjunta.json?v=1", { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (d) { pintar(d); })
          .catch(function (e) {
            console.warn("Ranking no disponible: " + e);
            tbody.innerHTML = '<tr><td colspan="4"><div class="rk-empty">No se pudo cargar el ranking.</div></td></tr>';
          });
      }
      cargar();
      setInterval(cargar, 60000);
    })();
  </script>
</body>
</html>
