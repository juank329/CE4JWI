<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Tarjetas QSL Online - CE4JWI</title>
    <style>
        :root {
            --navy: #1a5276;
            --navy-dark: #113f5c;
            --red: #e74c3c;
            --green: #27ae60;
            --green-dark: #1e8449;
            --border: #e5e8e8;
            --text: #2c3e50;
            --text-soft: #566573;
            --bg: #f0f4f8;
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef3f8 0%, #dce8f2 100%);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text);
        }

        .container {
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 34px rgba(26, 82, 118, 0.12);
            width: 100%;
            max-width: 1200px;
            padding: 24px;
            text-align: center;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .call-sign {
            background: linear-gradient(135deg, var(--navy), var(--red));
            color: white;
            font-weight: 800;
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            letter-spacing: 1px;
            padding: 6px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(26, 82, 118, 0.25);
        }

        h2 { color: var(--navy); font-size: clamp(1.2rem, 3vw, 1.6rem); }

        p.sub {
            color: var(--text-soft);
            font-size: 0.92rem;
            margin-top: 8px;
        }

        .stats { margin: 16px 0 4px; font-size: 0.85rem; color: var(--navy); font-weight: 600; }

        /* buscador compacto y centrado */
        .search-area { display: flex; justify-content: center; margin-top: 18px; }
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 520px;
            flex-wrap: nowrap;
        }
        input[type="text"] {
            flex: 1 1 0;
            min-width: 0;
            padding: 12px 14px;
            border: 2px solid #ccd1d1;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        input[type="text"]:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(26,82,118,0.15); }
        button {
            background: linear-gradient(135deg, var(--navy), var(--navy-dark));
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            flex: 0 0 auto;
            white-space: nowrap;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        /* grid adaptable */
        .grid-qsl {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 28px;
            text-align: left;
        }
        .card-qsl {
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: var(--radius);
            background: #fafcfe;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .card-qsl:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .card-qsl span {
            font-weight: bold;
            color: var(--text);
            font-size: 0.78rem;
            display: block;
            margin-bottom: 6px;
            word-break: break-word;
            line-height: 1.35;
        }
        .qsl-thumbnail {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            border: 1px solid #d5dbdb;
            transition: transform 0.2s;
            cursor: pointer;
            background: #fff;
        }
        .qsl-thumbnail:hover { transform: scale(1.02); }
        .btn-view {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: auto;
            transition: opacity 0.2s;
        }
        .btn-view:hover { opacity: 0.88; }

        .no-results, .loading { color: var(--red); font-weight: bold; margin-top: 20px; display: none; padding: 10px; }
        .loading { color: var(--navy); }

        .footer-note {
            margin-top: 26px;
            font-size: 0.75rem;
            color: var(--text-soft);
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        /* responsive */
        @media (max-width: 680px) {
            body { padding: 10px; }
            .container { padding: 16px; }
            .grid-qsl { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .search-box { flex-wrap: nowrap; }
            input[type="text"] { flex: 1 1 auto; min-width: 56px; }
            button { flex: 0 0 auto; padding: 12px 14px; }
        }
        @media (max-width: 380px) {
            .grid-qsl { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Buscador de Tarjetas QSL Online</h2>
            <span class="call-sign">CE4JWI</span>
        </div>
        <p class="sub">Ingresa tu indicativo para descargar en tiempo real tus confirmaciones de radio.</p>

        <div class="search-area">
            <div class="search-box">
                <input type="text" id="callInput" placeholder="Ej: XR4MAU" autocomplete="off" enterkeyhint="search">
                <button id="btnBuscar" onclick="buscarQSLs()">BUSCAR QSL</button>
            </div>
        </div>

        <div id="loading" class="loading">⏳ Consultando el libro de guardia...</div>
        <div id="noResults" class="no-results">❌ No se encontraron tarjetas para ese indicativo en el libro de guardia.</div>
        <div id="resultGrid" class="grid-qsl"></div>
        <div id="stats" class="stats"></div>
    </div>

    <script>
        let cacheQSL = null;

        function mostrarCargando(visible) {
            document.getElementById('loading').style.display = visible ? 'block' : 'none';
        }

        function buscarQSLs() {
            let callBuscado = document.getElementById('callInput').value.trim().toUpperCase();
            if (!callBuscado) return;

            // Si el colega digita su indicativo con SSID (ej: XR4MAU-9), se limpia de forma automática
            if (callBuscado.includes('-')) callBuscado = callBuscado.split('-')[0];

            const grid = document.getElementById('resultGrid');
            const noRes = document.getElementById('noResults');
            const stats = document.getElementById('stats');
            grid.innerHTML = "";
            noRes.style.display = "none";
            stats.innerHTML = "";
            mostrarCargando(true);

            const cargar = cacheQSL
                ? Promise.resolve(cacheQSL)
                : fetch('../log_qsl.json?t=' + new Date().getTime()).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                }).catch(() => fetch('https://qsl.net/ce4jwi/log_qsl.json?t=' + new Date().getTime()).then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })).then(data => { cacheQSL = data; return data; });

            cargar.then(data => {
                mostrarCargando(false);
                // coincidencia exacta en el índice JSON del servidor
                const filtrados = data.filter(qsl => (qsl.call || '').toUpperCase().trim() === callBuscado);

                if (filtrados.length === 0) {
                    noRes.style.display = "block";
                    return;
                }

                // ordenar por fecha descendente
                filtrados.sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')));

                stats.innerHTML = "📇 " + filtrados.length + " tarjeta" + (filtrados.length === 1 ? "" : "s") + " encontrada" + (filtrados.length === 1 ? "" : "s") + " para <b>" + callBuscado + "</b>";

                filtrados.forEach(qsl => {
                    const div = document.createElement('div');
                    div.className = 'card-qsl';

                    // extraemos el nombre real del archivo desde la URL para sugerencia de guardado
                    const nombreArchivoReal = String(qsl.url || '').substring(String(qsl.url || '').lastIndexOf('/') + 1);

                    const evento = String(qsl.carpeta || 'General').replace(/_/g, ' ');
                    const meta = [];
                    if (qsl.fecha) meta.push("📅 " + qsl.fecha);
                    if (qsl.modo) meta.push("📻 " + qsl.modo);

                    div.innerHTML = `
                        <a href="${qsl.url}" target="_blank" rel="noopener">
                            <img class="qsl-thumbnail" loading="lazy" src="${qsl.url}" alt="QSL Preview">
                        </a>
                        <span>📂 Evento: <b>${evento}</b></span>
                        ${meta.length ? `<span>${meta.join(' &nbsp;|&nbsp; ')}</span>` : ''}
                        <a class="btn-view" href="${qsl.url}" download="${nombreArchivoReal}">📥 DESCARGAR</a>
                    `;
                    grid.appendChild(div);
                });
            }).catch(() => {
                mostrarCargando(false);
                noRes.innerText = "⚠️ Aún no se han registrado activaciones en el servidor.";
                noRes.style.display = "block";
            });
        }

        document.getElementById('callInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') buscarQSLs();
        });
    </script>
</body>
</html>
