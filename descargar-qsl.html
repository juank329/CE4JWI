<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Roboto:wght@500;700;900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Roboto:wght@500;700;900&display=swap"></noscript>
  <title>Descarga de Tarjetas QSL - CE4JWI</title>
  <meta name="description" content="Buscador de tarjetas QSL CE4JWI. Descarga en tiempo real tus confirmaciones de radio por indicativo.">
  <link rel="stylesheet" href="recursos/styles.css?v=3">
  <link rel="stylesheet" href="recursos/header-responsive.css">
  <link rel="stylesheet" href="recursos/slider.css">
  <link rel="stylesheet" href="recursos/buscador-qsl.css">
  <link rel="icon" href="public/favicon-32x32.png">
</head>
<body>
  <div id="header-container"></div>
  <div id="marquee-container"></div>

  <main class="main-container">
    <div class="content">

      <div class="banner">
        <h1 data-i18n="qsl.titulo">Descarga de Tarjetas QSL</h1>
      </div>

      <section class="page-content">

        <!-- ============ Cabecera del buscador ============ -->
        <div class="qsl-head">
          <h2 class="qsl-title" data-i18n="qsl.titulo">Buscador de Tarjetas QSL Online</h2>
          <span class="qsl-call">CE4JWI</span>
        </div>

        <p class="qsl-nota" style="margin-bottom:1rem;margin-top:0;" data-i18n="qsl.nota">Ingresa tu indicativo para descargar en tiempo real tus confirmaciones de radio.</p>

        <!-- ============ Formulario ============ -->
        <form class="qsl-form" id="qslForm" onsubmit="event.preventDefault(); document.getElementById('btnBuscar').click();">
          <div class="qsl-campo">
            <label for="callInput" data-i18n="qsl.indicativo">Indicativo</label>
            <input type="text" id="callInput" placeholder="Ej: XR4MAU" data-i18n-ph="qsl.placeholder" autocomplete="off" enterkeyhint="search" spellcheck="false">
          </div>
          <div class="qsl-acciones">
            <button type="button" class="btn-buscar" id="btnBuscar" data-i18n="qsl.buscar">BUSCAR QSL</button>
            <button type="button" class="btn-limpiar" id="btnLimpiar" data-i18n="qsl.limpiar">Limpiar</button>
          </div>
        </form>

        <!-- ============ Filtro por estación ============ -->
        <div class="qsl-filtros">
          <span class="qsl-filtro-label" data-i18n="qsl.estacion">Estación:</span>
          <button type="button" class="qsl-filtro activo" data-emisora="TODAS"><span data-i18n="qsl.todas">Todas</span> <span>(0)</span></button>
          <button type="button" class="qsl-filtro" data-emisora="CE4JWI">CE4JWI <span>(0)</span></button>
          <button type="button" class="qsl-filtro" data-emisora="XR4MAU">XR4MAU <span>(0)</span></button>
        </div>

        <!-- ============ Estados ============ -->
        <div id="cargando" class="qsl-cargando" data-i18n="qsl.cargando">⏳ Consultando el libro de guardia...</div>
        <div id="aviso" class="qsl-aviso"></div>
        <div id="stats" class="qsl-estado" style="font-weight:700;color:var(--blue);"></div>

        <!-- ============ Resultados ============ -->
        <div id="resultGrid" class="qsl-grid"></div>

        <div id="estado" class="qsl-nota"></div>

      </section>

    </div>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>
  </main>

  <div id="footer-container"></div>

  <script src="recursos/actividades_20260919_a98a6563.js" defer></script>

  <script defer src="recursos/buscador-qsl_20260916.js"></script>
</body>
</html>
