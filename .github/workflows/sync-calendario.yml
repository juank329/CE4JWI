name: Sync Google Calendar to JSON

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CE4JWI repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync calendario
        run: python sync_calendario.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recursos/eventos-calendario.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync eventos Google Calendar -> eventos-calendario.json"
            git push origin main
          else
            echo "Sin cambios en eventos-calendario.json"
          fi
