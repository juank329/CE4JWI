name: Nightly dev → main merge

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC cada noche
  workflow_dispatch:     # Permite ejecutar manualmente

permissions:
  contents: write

jobs:
  merge-dev-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch origin dev main

      - name: Check if dev has new commits
        id: check
        run: |
          # Commits en dev que no están en main
          NEW=$(git rev-list --count origin/main..origin/dev 2>/dev/null || echo 0)
          echo "new_commits=$NEW" >> $GITHUB_OUTPUT
          echo "dev tiene $NEW commits nuevos sobre main"

      - name: Merge dev → main
        if: steps.check.outputs.new_commits != '0'
        run: |
          git checkout main
          git merge --no-ff origin/dev -m "chore: nightly merge dev → main ($(date -u +%Y-%m-%d))"
          git push origin main
          echo "✅ Merge nocturno completado"

      - name: No changes
        if: steps.check.outputs.new_commits == '0'
        run: echo "ℹ️ Sin commits nuevos en dev. Nada que hacer."