name: Sync QSL Index to GitHub Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout CE4JWI repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync QSL index (FTP → GitHub Pages)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > sync.py << 'PYEOF'
          import ftplib, json, requests, base64, os, sys, time, datetime
          from io import BytesIO

          FTP_HOST = os.environ['FTP_HOST']
          FTP_USER = os.environ['FTP_USER']
          FTP_PASS = os.environ['FTP_PASS']
          GITHUB_REPO = os.environ['GITHUB_REPO']
          GITHUB_TOKEN = os.environ['GITHUB_TOKEN']

          TEST_CALLS = {"XR4MAU"}
          TEST_FOLDERS = {"TEST"}
          DIAS_RETENCION = 365

          def es_test(item):
              return (item.get("call") in TEST_CALLS) or (item.get("carpeta") in TEST_FOLDERS)

          def ftp_connect():
              for attempt in range(3):
                  try:
                      s = ftplib.FTP(FTP_HOST, FTP_USER, FTP_PASS, timeout=30)
                      s.cwd("/")
                      return s
                  except Exception as e:
                      print(f"[RETRY {attempt+1}/3] FTP connect failed: {e}")
                      time.sleep(2)
              raise RuntimeError("FTP connection failed after 3 attempts")

          def list_ftp_files(session):
              files = []
              session.retrlines("NLST", files.append)
              return files

          def download_json(session):
              buf = BytesIO()
              session.retrbinary("RETR log_qsl.json", buf.write)
              buf.seek(0)
              return json.loads(buf.read().decode("utf-8"))

          def upload_json(session, entries):
              data = json.dumps(entries, ensure_ascii=False).encode("utf-8")
              session.storbinary("STOR log_qsl.json", BytesIO(data))

          def delete_ftp_file(session, filename):
              try:
                  session.delete(filename)
                  return True
              except Exception as e:
                  print(f"[WARN] Delete failed {filename}: {e}")
                  return False

          def _call_desde_archivo(archivo):
              base = os.path.splitext(os.path.basename(archivo))[0]
              partes = base.split("_")
              if len(partes) >= 3:
                  return partes[2].upper()
              return base

          def parsearNombreArchivo(nombre):
              m_fecha = re.search(r"(\d{2})-(\d{2})-(\d{4})", nombre)
              m_hora = re.search(r"_(\d{4})_(?=[^_]*\.[a-z]+$)", nombre, re.IGNORECASE)
              m_modo = re.search(r"_([A-Z0-9]+)\.[a-z]+$", nombre, re.IGNORECASE)
              return type("Meta", (), {
                  "fecha": f"{m_fecha.group(3)}-{m_fecha.group(2)}-{m_fecha.group(1)}" if m_fecha else "",
                  "hora": f"{m_hora.group(1)[:2]}:{m_hora.group(1)[2:4]}" if m_hora else "",
                  "modo": m_modo.group(1) if m_modo else "",
              })()

          def github_push(entries):
              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/log_qsl.json"
              headers = {
                  "Authorization": f"Bearer {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github+json",
              }
              data = {
                  "message": "Auto-sync log_qsl.json from FTP",
                  "content": base64.b64encode(json.dumps(entries, ensure_ascii=False).encode()).decode(),
              }
              for attempt in range(3):
                  try:
                      r = requests.get(url, headers={"Authorization": f"Bearer {GITHUB_TOKEN}", "Accept": "application/vnd.github+json"}, timeout=10)
                      if r.status_code == 200:
                          data["sha"] = r.json()["sha"]
                      r = requests.put(url, headers=headers, json=data, timeout=15)
                      if r.status_code in (200, 201):
                          return True
                      print(f"[RETRY {attempt+1}/3] GitHub PUT failed: {r.status_code} {r.text[:200]}")
                  except Exception as e:
                      print(f"[RETRY {attempt+1}/3] GitHub error: {e}")
                  time.sleep(2)
              return False

          # Main
          s = ftp_connect()
          s.cwd("/")
          entries = download_json(s)

          # Reconcile JSON with actual FTP files
          ftp_files = []
          s.retrlines("NLST", ftp_files.append)
          ftp_jpgs = [f for f in ftp_files if f.lower().endswith('.jpg')]
          
          # Build lookup from existing entries by filename
          entries_by_file = {e.get("archivo"): e for e in entries if e.get("archivo")}
          
          new_entries = []
for jpg in ftp_jpgs:
               if jpg in entries_by_file:
                   # File exists in JSON, check if URL is correct (local GitHub Pages URL - repo CE4JWI)
                   e = entries_by_file[jpg]
                   expected_url = f"https://juank329.github.io/CE4JWI/qsl_images/{jpg}"
                   if e.get("url") != expected_url:
                       print(f"[FIX] Corrigiendo URL para {jpg}: {e.get('url')} -> {expected_url}")
                       e["url"] = expected_url
                   new_entries.append(e)
else:
                   # New file not in JSON, create entry
                   call = _call_desde_archivo(jpg)
                   meta = parsearNombreArchivo(jpg)
                   prefijo = jpg.split("_CE4JWI_")[0] if "_CE4JWI_" in jpg else "General"
                   
                   # New file not in JSON, create entry
                   call = _call_desde_archivo(jpg)
                   meta = parsearNombreArchivo(jpg)
                   prefijo = jpg.split("_CE4JWI_")[0] if "_CE4JWI_" in jpg else "General"
                   
                   # Download image from FTP and save locally
                   img_buf = BytesIO()
                   try:
                       s.retrbinary(f"RETR {jpg}", img_buf.write)
                       img_buf.seek(0)
                       img_data = img_buf.read()
                       
                       # Save image to local repo (CE4JWI/qsl_images/)
                       img_path = f"qsl_images/{jpg}"
                       with open(img_path, "wb") as f:
                           f.write(img_data)
                       print(f"[IMG] Guardada localmente: {jpg}")
                       # URL local en GitHub Pages (repo CE4JWI)
                       local_url = f"https://juank329.github.io/CE4JWI/qsl_images/{jpg}"
                   except Exception as e:
                       print(f"[WARN] No se pudo descargar imagen {jpg}: {e}")
                       local_url = f"https://qsl.net/{FTP_USER}/{jpg}"
                   
                   nuevo = {
                       "call": call,
                       "carpeta": prefijo,
                       "archivo": jpg,
                       "url": local_url,
                       "fecha": meta.fecha,
                       "hora": meta.hora,
                       "modo": meta.modo,
                   }
                   new_entries.append(nuevo)
                   print(f"[NEW] Nueva QSL detectada: {jpg} ({call})")
          
          entries = new_entries
          print(f"[RECONCILE] Total QSLs reconciliadas: {len(entries)}")

          # Clean test entries
          test_entries = [e for e in entries if e.get("call") in {"XR4MAU"} or e.get("carpeta") in {"TEST"}]
          if test_entries:
              for e in test_entries:
                  delete_ftp_file(s, e["archivo"])
              entries = [e for e in entries if e not in test_entries]
              print(f"[CLEAN] Removed {len(test_entries)} test entries")

          # Clean old entries (> 365 days)
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=365)
          old_entries = []
          remaining = []
          for e in entries:
              fecha_str = e.get("fecha", "")
              if fecha_str:
                  try:
                      d, m, y = map(int, fecha_str.split("/"))
                      fecha_qsl = datetime.datetime(y, m, d, tzinfo=datetime.timezone.utc)
                      if fecha_qsl < cutoff:
                          a_borrar.append(e)
                      else:
                          remaining.append(e)
                  except Exception:
                      remaining.append(e)
              else:
                  remaining.append(e)
          if a_borrar:
              for e in a_borrar:
                  delete_ftp_file(s, e["archivo"])
              entries = remaining
              print(f"[CLEAN] Removed {len(a_borrar)} entries > 365 days")
          else:
              print(f"[CLEAN] No old entries to remove")

upload_json(s, entries)
          s.quit()
          print(f"[OK] FTP updated: {len(entries)} entries")

          if not github_push(entries):
              sys.exit(1)
          print("[OK] GitHub Pages updated")
          
          # Download and save images locally for GitHub Pages hosting
          print("[IMG] Descargando imágenes nuevas...")
          os.makedirs("qsl_images", exist_ok=True)
          s2 = ftp_connect()
          s2.cwd("/")
          for e in entries:
              jpg = e.get("archivo")
              if jpg and jpg.lower().endswith(".jpg"):
                  img_path = f"qsl_images/{jpg}"
                  if not os.path.exists(img_path):
                      try:
                          buf = BytesIO()
                          s2.retrbinary(f"RETR {jpg}", buf.write)
                          with open(img_path, "wb") as f:
                              f.write(buf.getvalue())
                          print(f"[IMG] Guardada: {jpg}")
                      except Exception as e:
                          print(f"[IMG WARN] Error descargando {jpg}: {e}")
          s2.quit()

          PYEOF
          python sync.py

      - name: Commit and push QSL images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qsl_images/
          git commit -m "Add QSL images for local hosting" || true
          git push