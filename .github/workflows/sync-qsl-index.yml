name: Sync QSL Index to GitHub Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sync QSL index (FTP → GitHub Pages)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > sync.py << 'PYEOF'
          import ftplib, json, requests, base64, os, sys, time, datetime
          from io import BytesIO

          FTP_HOST = os.environ['FTP_HOST']
          FTP_USER = os.environ['FTP_USER']
          FTP_PASS = os.environ['FTP_PASS']
          GITHUB_REPO = os.environ['GITHUB_REPO']
          GITHUB_TOKEN = os.environ['GITHUB_TOKEN']

          TEST_CALLS = {"XR4MAU"}
          TEST_FOLDERS = {"TEST"}
          DIAS_RETENCION = 365

          def es_test(item):
              return (item.get("call") in TEST_CALLS) or (item.get("carpeta") in TEST_FOLDERS)

          def ftp_connect():
              for attempt in range(3):
                  try:
                      s = ftplib.FTP(FTP_HOST, FTP_USER, FTP_PASS, timeout=30)
                      s.cwd("/")
                      return s
                  except Exception as e:
                      print(f"[RETRY {attempt+1}/3] FTP connect failed: {e}")
                      time.sleep(2)
              raise RuntimeError("FTP connection failed after 3 attempts")

          def list_ftp_files(session):
              files = []
              session.retrlines("NLST", files.append)
              return files

          def download_json(session):
              buf = BytesIO()
              session.retrbinary("RETR log_qsl.json", buf.write)
              buf.seek(0)
              return json.loads(buf.read().decode("utf-8"))

          def upload_json(session, entries):
              data = json.dumps(entries, ensure_ascii=False).encode("utf-8")
              session.storbinary("STOR log_qsl.json", BytesIO(data))

          def delete_ftp_file(session, filename):
              try:
                  session.delete(filename)
                  return True
              except Exception as e:
                  print(f"[WARN] Delete failed {filename}: {e}")
                  return False

          def github_push(entries):
              url = f"https://api.github.com/repos/{GITHUB_REPO}/contents/log_qsl.json"
              headers = {
                  "Authorization": f"Bearer {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github+json",
              }
              data = {
                  "message": "Auto-sync log_qsl.json from FTP",
                  "content": base64.b64encode(json.dumps(entries, ensure_ascii=False).encode()).decode(),
              }
              for attempt in range(3):
                  try:
                      r = requests.get(url, headers={"Authorization": f"Bearer {GITHUB_TOKEN}", "Accept": "application/vnd.github+json"}, timeout=10)
                      if r.status_code == 200:
                          data["sha"] = r.json()["sha"]
                      r = requests.put(url, headers=headers, json=data, timeout=15)
                      if r.status_code in (200, 201):
                          return True
                      print(f"[RETRY {attempt+1}/3] GitHub PUT failed: {r.status_code} {r.text[:200]}")
                  except Exception as e:
                      print(f"[RETRY {attempt+1}/3] GitHub error: {e}")
                  time.sleep(2)
              return False

          # Main
          s = ftp_connect()
          s.cwd("/")
          entries = download_json(s)

          # Clean test entries
          test_entries = [e for e in entries if e.get("call") in {"XR4MAU"} or e.get("carpeta") in {"TEST"}]
          if test_entries:
              for e in test_entries:
                  delete_ftp_file(s, e["archivo"])
              entries = [e for e in entries if e not in test_entries]
              print(f"[CLEAN] Removed {len(test_entries)} test entries")

          # Clean old entries (> 365 days)
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=365)
          old_entries = []
          remaining = []
          for e in entries:
              fecha_str = e.get("fecha", "")
              if fecha_str:
                  try:
                      d, m, y = map(int, fecha_str.split("/"))
                      fecha_qsl = datetime.datetime(y, m, d, tzinfo=datetime.timezone.utc)
                      if fecha_qsl < cutoff:
                          a_borrar.append(e)
                      else:
                          remaining.append(e)
                  except Exception:
                      remaining.append(e)
              else:
                  remaining.append(e)
          if a_borrar:
              for e in a_borrar:
                  delete_ftp_file(s, e["archivo"])
              entries = remaining
              print(f"[CLEAN] Removed {len(a_borrar)} entries > 365 days")
          else:
              print(f"[CLEAN] No old entries to remove")

          upload_json(s, entries)
          s.quit()
          print(f"[OK] FTP updated: {len(entries)} entries")

          if not github_push(entries):
              sys.exit(1)
          print("[OK] GitHub Pages updated")
          PYEOF
          python sync.py