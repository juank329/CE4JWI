name: Sync QSL Index + Images to GitHub Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CE4JWI repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Run sync
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP2_HOST: ${{ secrets.FTP2_HOST }}
          FTP2_USER: ${{ secrets.FTP2_USER }}
          FTP2_PASS: ${{ secrets.FTP2_PASS }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python sync.py
