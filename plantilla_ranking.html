<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANTILLA RANKING — CE4JWI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="recursos/styles.css?v=2">
  <link rel="stylesheet" href="recursos/header-responsive.css">
  <link rel="stylesheet" href="recursos/slider.css">
  <style>
    /* =========================================================
       1) SOLO CAMBIA ESTE BLOQUE DE COLORES (fondo + titulo)
       ========================================================= */
    :root {
      --rk-principal: #0b4f84;      /* color del titulo / acentos */
      --rk-fondo: #f7f9fc;          /* fondo del bloque ranking   */
      --rk-borde: #0b4f84;          /* borde del blob de ranking  */
      --rk-puntos: #16a34a;         /* color del puntaje          */
      --rk-numero: #d6bb9c;         /* color de la posicion '#'   */
    }
    /* ========================================================= */

    .ranking-section {
      max-width: 820px;
      margin: 2rem auto 0;
      background: var(--rk-fondo);
      border: 2px solid var(--rk-borde);
      border-radius: 16px;
      padding: 1.2rem 1.4rem 1.4rem;
      box-shadow: 0 4px 14px rgba(0,0,0,.07);
    }
    .ranking-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
    .ranking-header .ranking-live {
      display: inline-block;
      background: #0e8a5f; color: #fff;
      font-size: 0.7rem; font-weight: 700;
      padding: 0.12rem 0.55rem; border-radius: 50px;
      letter-spacing: .5px; vertical-align: 2px;
      animation: pulse-live 1.6s ease-in-out infinite;
    }
    @keyframes pulse-live { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .total-badge {
      background: var(--rk-borde); color: #fff;
      font-weight: 700; font-size: 0.85rem;
      padding: 0.25rem 0.9rem; border-radius: 50px;
    }
    .ranking-updated { text-align: right; font-size: 0.72rem; color: #999; margin-top: 0.35rem; }
    .ranking-table { width: 100%; border-collapse: collapse; margin-top: 0.6rem; }
    .ranking-table th {
      background: var(--rk-borde); color: #fff;
      text-align: left; font-size: 0.8rem;
      padding: 0.6rem 0.9rem; letter-spacing: .3px;
      white-space: nowrap;
    }
    .ranking-table th:first-child { border-radius: 8px 0 0 0; text-align: center; width: 52px; }
    .ranking-table th:last-child { border-radius: 0 8px 0 0; text-align: right; }
    .ranking-table tbody tr:nth-child(even) { background: rgba(0,0,0,.03); }
    .ranking-table tbody td { padding: 0.55rem 0.9rem; border-bottom: 1px solid #e3e8ee; font-size: 0.9rem; }
    .ranking-table tbody td:first-child {
      text-align: center; font-weight: 800; font-size: 1rem;
      color: var(--rk-numero); font-family: 'JetBrains Mono', monospace;
    }
    .ranking-table tbody td.puntos {
      text-align: right; font-weight: 700; color: var(--rk-puntos);
      font-family: 'JetBrains Mono', monospace; white-space: nowrap;
    }
    /* banderas.js convierte cada <a class="call-badge"> en bandera + indicativo */
    .call-badge {
      color: var(--rk-principal) !important;
      font-weight: 700; text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
    }
    .ranking-empty { text-align: center; padding: 3rem 1rem; color: #6c757d; font-size: 1rem; }
    .ranking-empty .spinner {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid #e0e0e0; border-top-color: var(--rk-principal);
      border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: .8rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ranking-footer { text-align: center; margin-top: 1rem; font-size: 0.78rem; color: #999; }
    @media (max-width: 600px) {
      .ranking-table thead th, .ranking-table tbody td { padding: 0.5rem 0.6rem; font-size: 0.8rem; }
      .ranking-section { padding: 0.9rem; }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>
  <div id="marquee-container"></div>

  <main class="main-container">
    <div class="content">
      <div class="banner">
        <h1>NOMBRE DE LA ACTIVIDAD 2026</h1>
      </div>

      <section class="page-content">
        <!-- Texto de presentacion de la actividad -->

        <div class="ranking-title">
          <h2>Ranking Acumulado de la Actividad</h2>
          <p>Ranking <strong>en vivo</strong> de los contactos APRS.</p>
        </div>

        <div class="ranking-section">
          <div class="ranking-header">
            <h2>Estaciones Participantes <span class="ranking-live">En vivo</span></h2>
            <div class="total-badge">Cargando&hellip;</div>
          </div>
          <div class="ranking-updated" id="ranking-updated"></div>
          <div class="ranking-table-wrap">
            <table class="ranking-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Indicativo</th>
                  <th>Puntos</th>
                </tr>
              </thead>
              <tbody id="ranking-tbody">
                <tr><td colspan="3"><div class="ranking-empty"><div class="spinner"></div><div>Cargando ranking&hellip;</div></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="ranking-footer">Ranking en vivo &middot; NOMBRE DE LA ACTIVIDAD &middot; CE4JWI</div>
        </div>
      </section>
    </div>
    <div id="sidebar-container"></div>
  </main>

  <div id="footer-container"></div>

  <!-- 2) OBLIGATORIO: estos 3 scripts (los dos primeros ya existen) -->
  <script src="recursos/actividades_20260915000322_452461df.js" defer></script>
  <script src="recursos/componentes.js?v=2"></script>
  <script src="recursos/banderas_20260915.js" defer></script>

  <!-- 3) SOLO CAMBIA: la ruta de tu API de ranking -->
  <script>
    (function () {
      var tbody = document.getElementById("ranking-tbody");
      if (!tbody) return;
      var API = "ranking-data/XXXX/final.json";   // <= ruta del ranking de esta actividad
      var TOTAL_HEADER = "Total:";     // texto del badge de total (opcional)

      // El API debe responder { total: n, contactos: [ { call: 'CE4JWI', puntos: 3 }, ... ] }
      fetch(API)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) {
          var badge = document.querySelector(".total-badge");
          if (badge) badge.textContent = (TOTAL_HEADER ? TOTAL_HEADER + " " : "") + (d.total ?? d.contactos.length);
          var up = document.getElementById("ranking-updated");
          if (up) up.textContent = "Actualizado: " + new Date().toLocaleString("es-CL");
          var filas = (d.contactos || []).slice().sort(function (a, b) { return (b.puntos ?? 0) - (a.puntos ?? 0); });
          if (!filas.length) {
            tbody.innerHTML = '<tr><td colspan="3"><div class="ranking-empty">Aún no hay contactos en esta actividad.</div></td></tr>';
            return;
          }
          tbody.innerHTML = filas.map(function (f, i) {
            return '<tr>' +
              '<td>' + (i + 1) + '</td>' +
              '<td><a class="call-badge" href="https://www.qrz.com/db/' + f.call + '" target="_blank" rel="noopener">' + f.call + '</a></td>' +
              '<td class="puntos">' + (f.puntos ?? 0) + '</td>' +
              '</tr>';
          }).join("");
        })
        .catch(function () {
          tbody.innerHTML = '<tr><td colspan="3"><div class="ranking-empty">No se pudo cargar el ranking. Intenta de nuevo.</div></td></tr>';
        });
    })();
  </script>
</body>
</html>
